<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Cozy HQ preview</title>
    <link rel="stylesheet" href="dist/main.css" />
    <style>
      html, body { margin: 0; background: #1b1820; color: #eee; font: 12px ui-monospace, Menlo, monospace; }
      #stage { position: relative; }
      .cat { padding: 12px; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
      .cat figure { margin: 0; padding: 8px; background: #2a2531; border-radius: 6px; }
      .cat figcaption { margin-top: 6px; opacity: 0.85; }
      .cat .pair { display: flex; gap: 10px; align-items: flex-end; min-height: 40px; }
      .cat canvas { image-rendering: pixelated; background: #3a3542; }
      h2 { margin: 16px 12px 4px; font-size: 14px; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script src="dist/main.js"></script>
  </body>
</html>
